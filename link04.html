<style>

  }

  }

  }
  .answer {
    padding: 15px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
    user-select: none;
    border: none;
    background: #e0e0e0;
  }
  .answer.selected {
    outline: 3px solid #333;
  }
  #buttons {
    text-align: center;
    margin-bottom: 10px;
  }
  #rangeSelect {
    font-size: 32px; /* 放大 2 倍 */

    margin-right: 20px;
  }

    padding: 10px 20px;
    font-size: 16px;
    margin: 0 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  #result {
    text-align: center;
    margin-top: 20px;
    font-size: 20px;
    height: 24px;
  }
  #backHome {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 8px 12px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    background-color: #333;
    color: #fff;
    cursor: pointer;
  }
  .marker {
    color: red;
    font-size: 32px;
    margin: -40px 0;
  }

    }

      font-size: 24px;
    }

      font-size: 18px;

      padding: 10px 20px;
    }

  {卦名:"巽為風", 世位:6, 應位:3, 爻:["⚋","⚊","⚊","⚋","⚊","⚊"], 宮位:"巽宮", 宮序:57, 爻語:"0", 爻圖:"○○○", 易經序:64},
  {卦名:"風天小畜", 世位:1, 應位:4, 爻:["⚊","⚊","⚊","⚋","⚊","⚊"], 宮位:"巽宮", 宮序:58, 爻語:"1-4", 爻圖:"╳○○", 易經序:57},
  {卦名:"風火家人", 世位:2, 應位:5, 爻:["⚊","⚋","⚊","⚋","⚊","⚊"], 宮位:"巽宮", 宮序:59, 爻語:"1-4,2-5", 爻圖:"╳╳○", 易經序:61},
  {卦名:"風雷益", 世位:3, 應位:6, 爻:["⚊","⚋","⚋","⚋","⚊","⚊"], 宮位:"巽宮", 宮序:60, 爻語:"1-4,2-5,3-6", 爻圖:"╳╳╳", 易經序:63},
  {卦名:"天雷無妄", 世位:4, 應位:1, 爻:["⚊","⚋","⚋","⚊","⚊","⚊"], 宮位:"巽宮", 宮序:61, 爻語:"2-5,3-6", 爻圖:"○╳╳", 易經序:7},
  {卦名:"火雷噬嗑", 世位:5, 應位:2, 爻:["⚊","⚋","⚋","⚊","⚋","⚊"], 宮位:"巽宮", 宮序:62, 爻語:"3-6", 爻圖:"○○╳", 易經序:39},
  {卦名:"山雷頤", 世位:4, 應位:1, 爻:["⚊","⚋","⚋","⚋","⚋","⚊"], 宮位:"巽宮", 宮序:63, 爻語:"1-4,3-6", 爻圖:"╳○╳", 易經序:31},
  {卦名:"山風蠱", 世位:3, 應位:6, 爻:["⚋","⚊","⚊","⚋","⚋","⚊"], 宮位:"巽宮", 宮序:64, 爻語:"2-5", 爻圖:"○╳○", 易經序:32}
];

let currentQuestion = null;
let previousQuestion = null;
let selectedAnswer = null;

const questionDiv = document.getElementById('question');
const hintDiv = document.getElementById('hint');
const guaArea = document.getElementById('guaArea');
const answerDivs = document.querySelectorAll('.answer');
const startBtn = document.getElementById('startBtn');
const confirmBtn = document.getElementById('confirmBtn');
const nextBtn = document.getElementById('nextBtn');
const resultDiv = document.getElementById('result');
const rangeSelect = document.getElementById('rangeSelect');

// 開始
startBtn.addEventListener('click', () => {
  previousQuestion = null;
  nextQuestion();
  startBtn.disabled = true;
  confirmBtn.disabled = true;
  nextBtn.disabled = true;
  resultDiv.innerHTML = '';
});

// 選擇答案
answerDivs.forEach(div => {
  div.addEventListener('click', () => {
    answerDivs.forEach(d => d.classList.remove('selected'));
    div.classList.add('selected');
    selectedAnswer = parseInt(div.dataset.answer);
    confirmBtn.disabled = false;
  });
});

// 確定
confirmBtn.addEventListener('click', () => {
  if (!currentQuestion || !selectedAnswer) return;
  const correctAnswer = currentQuestion.世位;
  if (selectedAnswer === correctAnswer) {
    resultDiv.innerHTML = '答對了！';
    const yaoDivs = document.querySelectorAll('.yao');

    // 清除舊標記
    document.querySelectorAll('.marker').forEach(m => m.remove());

    // 世爻標記
    const shiIndex = 6 - correctAnswer; // 顯示 6→1
    const shiMarker = document.createElement('div');
    shiMarker.className = "marker";
    shiMarker.innerHTML = "世";
    yaoDivs[shiIndex].appendChild(shiMarker);

    // 應爻標記 (直接使用 應位 欄)
    const yingIndex = 6 - currentQuestion.應位;
    const yingMarker = document.createElement('div');
    yingMarker.className = "marker";
    yingMarker.innerHTML = "應";
    yaoDivs[yingIndex].appendChild(yingMarker);
  } else {
    resultDiv.innerHTML = `答錯了！正確答案是：${correctAnswer}`;
  }
  confirmBtn.disabled = true;
  nextBtn.disabled = false;
});

// 下一題
nextBtn.addEventListener('click', () => {
  previousQuestion = currentQuestion;
  nextQuestion();
  resultDiv.innerHTML = '';
  nextBtn.disabled = true;
});

// 產生新題（依範圍）
function nextQuestion() {
  // 建立範圍題庫
  const range = rangeSelect.value;
  let pool = [];
  if (range === 'all') {
    pool = guaData;
  } else {
    pool = guaData.filter(q => q.宮位 === range);
  }
  // 若範圍太小，至少保證有題目
  if (pool.length === 0) {
    pool = guaData;
  }

  // 避免與上一題相同
  let newQuestion = null;
  if (pool.length === 1) {
    newQuestion = pool[0];
  } else {
    do {
      const index = Math.floor(Math.random() * pool.length);
      newQuestion = pool[index];
    } while (previousQuestion && newQuestion.卦名 === previousQuestion.卦名);
  }

  currentQuestion = newQuestion;

  // 題目與提示
  questionDiv.innerHTML = `請問卦名 <strong>${currentQuestion.卦名}</strong> 的世爻在哪裡？`;
  hintDiv.innerHTML = `(提示：${currentQuestion.爻語},${currentQuestion.爻圖})`;

  // 顯示爻象 (6到1)
  guaArea.innerHTML = "";
  for (let i = 5; i >= 0; i--) {
    const div = document.createElement('div');
    div.className = "yao";
    div.innerHTML = currentQuestion.爻[i];
    guaArea.appendChild(div);
  }

  // 重置選擇與按鈕狀態、清除標記
  answerDivs.forEach(d => d.classList.remove('selected'));
  selectedAnswer = null;
  confirmBtn.disabled = true;
  document.querySelectorAll('.marker').forEach(m => m.remove());
}
</script>
