<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>連連看：八卦與方位</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f8ff;
    margin: 20px;
  }
  h1 {
    text-align: center;
  }
  #game {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    border: 2px solid #333;
    border-radius: 10px;
    background: #fff;
    position: relative;
  }
  #question {
    font-size: 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  #answers {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
  }
  .answer {
    padding: 15px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
    user-select: none;
    border: none;
    margin: 5px;
    min-width: 80px;
    text-align: center;
    background-color: #e0e0e0;
    transition: outline 0.3s;
  }
  /* 方位底色設定 */
  .answer[data-answer="東"] { background-color: #ffcccc; }
  .answer[data-answer="西"] { background-color: #ccccff; }
  .answer[data-answer="南"] { background-color: #ffcc99; }
  .answer[data-answer="北"] { background-color: #99ccff; }
  .answer[data-answer="東北"] { background-color: #ff9999; }
  .answer[data-answer="東南"] { background-color: #ffff99; }
  .answer[data-answer="西北"] { background-color: #cccccc; }
  .answer[data-answer="西南"] { background-color: #99ff99; }

  .answer.selected {
    outline: 3px solid #333;
  }
  #buttons {
    text-align: center;
    margin-bottom: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    margin: 0 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  #result {
    text-align: center;
    margin-top: 20px;
    font-size: 20px;
    height: 24px;
  }
  #backHome {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 8px 12px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    background-color: #333;
    color: #fff;
    cursor: pointer;
  }
  /* 題目顏色 */
  .blue { color: blue; }
  .red { color: red; }

  #rangeSelect {
    font-size: 32px; /* 放大 2 倍 */
    padding: 10px 20px;
    margin-right: 20px;
  }

  @media (max-width: 768px) {
    body { font-size: 16px; }
    #answers {
      flex-wrap: wrap;
      justify-content: space-around;
      gap: 10px;
    }
    .answer {
      font-size: 20px;
      padding: 15px 25px;
      margin: 5px 0;
    }
  }
  #rangeSelect {
    font-size: 32px; /* 放大 2 倍 */
    padding: 10px 20px;
    margin-right: 20px;
  }
</style>
</head>
<body>

<button id="backHome" onclick="location.href='index.html'">返回首頁</button>
<br>
<h1>連連看：八卦與方位(先天與後天)</h1>

<div id="game">
  <div id="question">點擊「開始」來挑戰！</div>
  <div id="answers">
    <div class="answer" data-answer="東">東</div>
    <div class="answer" data-answer="西">西</div>
    <div class="answer" data-answer="南">南</div>
    <div class="answer" data-answer="北">北</div>
    <div class="answer" data-answer="東北">東北</div>
    <div class="answer" data-answer="東南">東南</div>
    <div class="answer" data-answer="西北">西北</div>
    <div class="answer" data-answer="西南">西南</div>
  </div>
  <div id="buttons">
    <select id="rangeSelect">
    <!-- <option value="all">全部範圍</option> -->      
      <option value="先天">先天</option>
      <option value="後天">後天</option>
    </select>
    <button id="startBtn">開始</button>
    <button id="confirmBtn" disabled>確定</button>
    <button id="nextBtn" disabled>下一題</button>
  </div>
  <div id="result"></div>
</div>

<script>
const 八卦 = ['乾 ☰','坤 ☷','離 ☲','坎 ☵','震 ☳','兌 ☱','巽 ☴','艮 ☶'];

// 先天方位
const 先天配對 = {
  '乾 ☰':'南','坤 ☷':'北','離 ☲':'東','坎 ☵':'西',
  '震 ☳':'東南','兌 ☱':'西北','巽 ☴':'東北','艮 ☶':'西南'
};
// 後天方位
const 後天配對 = {
  '乾 ☰':'西北','坤 ☷':'西南','離 ☲':'南','坎 ☵':'北',
  '震 ☳':'東','兌 ☱':'西','巽 ☴':'東南','艮 ☶':'東北'
};

let currentQuestion=null, previousQuestion=null, selectedAnswer=null, currentRange='先天';

const questionDiv=document.getElementById('question');
const answerDivs=document.querySelectorAll('.answer');
const startBtn=document.getElementById('startBtn');
const confirmBtn=document.getElementById('confirmBtn');
const nextBtn=document.getElementById('nextBtn');
const resultDiv=document.getElementById('result');
const rangeSelect=document.getElementById('rangeSelect');

startBtn.addEventListener('click',()=>{
  previousQuestion=null;
  nextQuestion();
  startBtn.disabled=true;
  confirmBtn.disabled=true;
  nextBtn.disabled=true;
  resultDiv.innerHTML='';
});

rangeSelect.addEventListener('change',()=>{
  currentRange=rangeSelect.value;
});

answerDivs.forEach(div=>{
  div.addEventListener('click',()=>{
    answerDivs.forEach(d=>d.classList.remove('selected'));
    div.classList.add('selected');
    selectedAnswer=div.dataset.answer;
    confirmBtn.disabled=false;
  });
});

confirmBtn.addEventListener('click',()=>{
  if(!currentQuestion||!selectedAnswer)return;
  let correctAnswer;
  if(currentRange==='先天'){ correctAnswer=先天配對[currentQuestion]; }
  else if(currentRange==='後天'){ correctAnswer=後天配對[currentQuestion]; }
  else {
    // 全部範圍隨機選一種
    correctAnswer=Math.random()>0.5?先天配對[currentQuestion]:後天配對[currentQuestion];
  }
  if(selectedAnswer===correctAnswer){
    resultDiv.innerHTML='答對了！';
  } else {
    resultDiv.innerHTML=`答錯了！正確答案是：${correctAnswer}`;
  }
  confirmBtn.disabled=true;
  nextBtn.disabled=false;
});

nextBtn.addEventListener('click',()=>{
  previousQuestion=currentQuestion;
  nextQuestion();
  resultDiv.innerHTML='';
  nextBtn.disabled=true;
});

function nextQuestion(){
  let pool=八卦;
  let newQuestion;
  do{
    const index=Math.floor(Math.random()*pool.length);
    newQuestion=pool[index];
  }while(newQuestion===previousQuestion);
  currentQuestion=newQuestion;
  let colorClass=(currentRange==='先天')?'blue':(currentRange==='後天')?'red':'';
  questionDiv.innerHTML=`請連結八卦：<strong class="${colorClass}">${currentQuestion} (${currentRange})</strong>`;
  answerDivs.forEach(d=>d.classList.remove('selected'));
  selectedAnswer=null;
  confirmBtn.disabled=true;
}
</script>

</body>
</html>
