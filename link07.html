<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>八卦的納甲</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f8ff;
    margin: 20px;
  }
  h1 {
    font-size: 32px;
    text-align: center;
  }
  #game {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    border: 2px solid #333;
    border-radius: 10px;
    background: #fff;
  }
  #question {
    font-size: 24px;
    text-align: center;
    margin-bottom: 10px;
  }
  #hint {
    font-size: 20px;
    text-align: center;
    margin-bottom: 20px;
    color: #555;
    line-height: 1.6;
    white-space: pre-line;
  }

  #guaArea {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-left: -20%; /* 往左偏移，右邊可放圖片 */
  }
  .yaoRow {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    margin: 8px 0;
  }
  .branchLabel {
    width: 2em;
    text-align: right;
    visibility: hidden;
    font-size: 28px; /* 地支字體大小 */
  }
  .yao {
    font-size: 64px; /* ←這裡是爻符號大小，也可以改大或改小 */
    line-height: 1;
    position: relative;
    /* margin: 0px 0; */
  }
  .marker {
    color: red;
    font-size: 28px; /* 世、應字樣大小 */
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: -10px; /* 放在爻符號下方 */
  }

  #answers {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-around;
    margin-bottom: 20px;
  }
  .answer {
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
    user-select: none;
    border: none;
    background: #e0e0e0;
    min-width: 60px;
    text-align: center;
  }
  .answer.selected {
    outline: 3px solid #333;
  }

  #buttons {
    text-align: center;
    margin-bottom: 10px;
  }
  #rangeSelect {
    font-size: 32px;
    padding: 10px 20px;
    margin-right: 20px;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    margin: 0 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  #result {
    text-align: center;
    margin-top: 20px;
    font-size: 20px;
    height: 24px;
  }
  #backHome {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 8px 12px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    background-color: #333;
    color: #fff;
    cursor: pointer;
  }

  @media (max-width: 768px) {
    h1 { font-size: 24px; }
    #question { font-size: 22px; }
    #hint { font-size: 18px; }
    .yao { font-size: 64px; }
    .marker { font-size: 32px; bottom: -16px; }
    .answer { font-size: 18px; padding: 12px 16px; }
    #rangeSelect { font-size: 28px; padding: 8px 16px; }
  }
</style>
</head>
<body>

<button id="backHome" onclick="location.href='index.html'">返回首頁</button>
<br>
<h1>連連看：八卦的納甲 (測試版)</h1>

<div id="game">
  <div id="question">點擊「開始」來挑戰！</div>
  <div id="hint"></div>

  <div id="guaArea"></div>

  <div id="answers"></div>

  <div id="buttons">
    <select id="rangeSelect">
      <option value="all">全部範圍</option>
      <option value="純卦">純卦</option>
      <option value="乾宮">乾宮</option>
      <option value="震宮">震宮</option>
      <option value="坎宮">坎宮</option>
      <option value="艮宮">艮宮</option>
      <option value="坤宮">坤宮</option>
      <option value="兌宮">兌宮</option>
      <option value="離宮">離宮</option>
      <option value="巽宮">巽宮</option>
    </select>
    <button id="startBtn">開始</button>
    <button id="confirmBtn" disabled>確定</button>
    <button id="nextBtn" disabled>下一題</button>
  </div>

  <div id="result"></div>
</div>

<!-- 引入題庫 -->

<script src="納甲.js">
</script>

<script>

const 地支 = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

let currentQuestion=null, selectedAnswer=null, askType=null;

const questionDiv=document.getElementById('question');
const hintDiv=document.getElementById('hint');
const guaArea=document.getElementById('guaArea');
const answersWrap=document.getElementById('answers');
const startBtn=document.getElementById('startBtn');
const confirmBtn=document.getElementById('confirmBtn');
const nextBtn=document.getElementById('nextBtn');
const resultDiv=document.getElementById('result');
const rangeSelect=document.getElementById('rangeSelect');

function renderAnswerButtons(){
  answersWrap.innerHTML='';
  地支.forEach(zhi=>{
    const btn=document.createElement('div');
    btn.className='answer';
    btn.textContent=zhi;
    btn.dataset.answer=zhi;
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.answer').forEach(d=>d.classList.remove('selected'));
      btn.classList.add('selected');
      selectedAnswer=btn.dataset.answer;
      confirmBtn.disabled=false;
    });
    answersWrap.appendChild(btn);
  });
}

function renderHint(){
  hintDiv.textContent="子、寅、辰、午、申、戌\n未、巳、卯、丑、亥、酉";
}

function renderGuaWithMarkers(q){
  guaArea.innerHTML='';
  for(let i=5;i>=0;i--){
    const row=document.createElement('div');
    row.className='yaoRow';

    const branchLabel=document.createElement('div');
    branchLabel.className='branchLabel';
    branchLabel.textContent=q.地支[i];
    row.appendChild(branchLabel);

    const yaoDiv=document.createElement('div');
    yaoDiv.className='yao';
    yaoDiv.textContent=q.爻[i];
    row.appendChild(yaoDiv);

    guaArea.appendChild(row);
  }

  const yaoDivs=document.querySelectorAll('.yao');
  const shiIndex=6-q.世位;
  const yingIndex=6-q.應位;

  const shiMarker=document.createElement('div');
  shiMarker.className='marker';
  shiMarker.textContent='世';
  yaoDivs[shiIndex].appendChild(shiMarker);

  const yingMarker=document.createElement('div');
  yingMarker.className='marker';
  yingMarker.textContent='應';
  yaoDivs[yingIndex].appendChild(yingMarker);
}

function nextQuestion() {
  // 依下拉選單篩選題庫
  const range = rangeSelect.value;
  let pool = [];

  if (range === 'all') {
    pool = guaData;
  } else if (range === '純卦') {
    // 各宮位的第一個（資料中每個宮位的首條）
    const palaceOrder = ['乾宮','震宮','坎宮','艮宮','坤宮','兌宮','離宮','巽宮'];
    pool = palaceOrder
      .map(p => guaData.find(q => q.宮位 === p))
      .filter(Boolean); // 去除找不到的情況
  } else {
    pool = guaData.filter(q => q.宮位 === range);
  }

  if (pool.length === 0) {
    pool = guaData; // 保底
  }

  // 隨機抽一題（從篩選後的集合中）
  const index = Math.floor(Math.random() * pool.length);
  currentQuestion = pool[index];

  // 題目文字
  askType = Math.random() < 0.5 ? '下卦' : '上卦';
  questionDiv.innerHTML = `請問卦名 <strong>${currentQuestion.卦名}</strong> 的<strong>${askType}</strong>納甲起點是？`;

  // 顯示提示與爻象
  renderHint();
  renderGuaWithMarkers(currentQuestion);

  // 重置狀態
  selectedAnswer = null;
  confirmBtn.disabled = true;
  nextBtn.disabled = true;
  resultDiv.innerHTML = '';
  document.querySelectorAll('.branchLabel').forEach(b => b.style.visibility = 'hidden');
}


startBtn.addEventListener('click',()=>{
  renderAnswerButtons();
  nextQuestion();
  startBtn.disabled=true;
});

confirmBtn.addEventListener('click',()=>{
  if(!currentQuestion||!selectedAnswer) return;
  const correct=askType==='下卦'?currentQuestion.地支[0]:currentQuestion.地支[3];
  if(selectedAnswer===correct){
    resultDiv.textContent='答對了！';
    document.querySelectorAll('.branchLabel').forEach(b=>b.style.visibility='visible');
  }else{
    resultDiv.textContent=`答錯了！正確答案是：${correct}`;
  }
  confirmBtn.disabled=true;
  nextBtn.disabled=false;
});

nextBtn.addEventListener('click',()=>{
  nextQuestion();
});

renderHint();
</script>
