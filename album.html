<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 

initial-scale=1.0">
  <title>相簿17</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; 

margin: 20px; background: #f4f6f9; }
    .debug { 
      background: #fff; padding: 20px; border: 3px solid 

#333; 
      border-radius: 10px; margin: 20px 0; font-size: 15px; 
    }
  </style>
</head>
<body>
  <h1 id="title">載入中...</h1>
  <a href="index_al.html">← 返回相簿列表</a>

  <div id="debug" class="debug">除錯資訊初始化...</div>

  <script>
    console.log("=== V17 開始執行 ===");

    const debug = document.getElementById('debug');
    const title = document.getElementById('title');

    debug.innerHTML += "\n✅ JavaScript 已成功執行";

    const OWNER = "jan21952";
    const REPO = "Linklink";
    const BASE_PATH = "static/images";

    // 取得 dir 參數
    const params = new URLSearchParams(location.search);
    const dir = params.get('dir');

    debug.innerHTML += `\n📁 相簿: ${dir || '未取得'}`;

    if (!dir) {
      title.textContent = "錯誤：未指定相簿";
      debug.innerHTML += "\n❌ 沒有 dir 參數";
    } else {
      title.textContent = dir + " - 正在載入...";
      
      debug.innerHTML += "\n🔍 開始呼叫 GitHub API...";

      fetch(`https://api.github.com/repos/${OWNER}/

${REPO}/contents/${BASE_PATH}/${dir}`)
        .then(res => {
          debug.innerHTML += `\n📡 API 狀態: ${res.status}`;
          return res.json();
        })
        .then(files => {
          debug.innerHTML += `\n✅ 取得 ${files.length} 個項

目`;

          const images = files.filter(f => f.type === "file" 

&& /\.(jpg|jpeg|png|gif|webp)$/i.test(f.name));
          debug.innerHTML += `\n🖼️ 找到 ${images.length} 張

圖片`;

          const galleryHTML = images.map(file => {
            const url = `https://raw.githubusercontent.com/

${OWNER}/${REPO}/main/${BASE_PATH}/${dir}/${file.name}`;
            return `<img src="${url}" style="width:180px; 

margin:8px; border-radius:8px;" loading="lazy">`;
          }).join('');

          document.body.innerHTML += `<div style="margin-

top:20px;">${galleryHTML}</div>`;
          
          title.textContent = `${dir} (${images.length} 張)`;
          debug.innerHTML += "\n🎉 縮圖已顯示完成！";
        })
        .catch(err => {
          debug.innerHTML += `\n❌ 錯誤: ${err.message}`;
          console.error(err);
        });
    }
  </script>
</body>
</html>
