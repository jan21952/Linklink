<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相簿10</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; margin: 20px; background: #f4f6f9; }
    .debug { background: #fff; padding: 15px; border: 1px solid #ccc; border-radius: 8px; margin: 20px 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1 id="title">載入中...</h1>
  <div class="debug" id="debug">除錯資訊初始化...</div>

  <script>
    const OWNER = "jan21952";
    const REPO = "Linklink";
    const BASE_PATH = "static/images";

    async function loadAlbum() {
      const debug = document.getElementById('debug');
      const params = new URLSearchParams(window.location.search);
      const dir = params.get('dir');

      debug.innerHTML += `\n\n📁 相簿名稱: ${dir}`;

      if (!dir) {
        document.getElementById('title').textContent = "錯誤：未帶 dir 參數";
        return;
      }

      try {
        const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${BASE_PATH}/${dir}`;
        debug.innerHTML += `\n🔗 正在呼叫: ${url}`;

        const res = await fetch(url);
        debug.innerHTML += `\n📡 回應狀態: ${res.status}`;

        if (!res.ok) throw new Error(`HTTP 錯誤 ${res.status}`);

        const files = await res.json();
        debug.innerHTML += `\n✅ 成功取得 ${files.length} 個項目`;

        const images = files.filter(f => f.type === "file" && /\.(jpe?g|png|gif|webp)$/i.test(f.name));
        debug.innerHTML += `\n🖼️ 圖片數量: ${images.length}`;

        document.getElementById('title').textContent = `${dir} (${images.length} 張)`;

      } catch (err) {
        debug.innerHTML += `\n❌ 錯誤: ${err.message}`;
        console.error(err);
      }
    }

    window.onload = loadAlbum;
  </script>
</body>
</html>
