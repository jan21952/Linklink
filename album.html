<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 

initial-scale=1.0">
  <title>相簿16</title>
  <style>
    body { 
      font-family: "Microsoft JhengHei", sans-serif; 
      margin: 20px; background: #f4f6f9; line-height: 1.6; 
    }
    .header { text-align: center; margin-bottom: 25px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 

1fr));
      gap: 12px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .debug { 
      background: #fff; padding: 15px; border: 2px solid 

#333; 
      border-radius: 8px; margin: 15px 0; font-size: 14px; 
      white-space: pre-wrap;
    }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">載入中...</h1>
    <div class="back"><a href="index_al.html">← 返回相簿列表

</a></div>
  </div>

  <div id="debug" class="debug">除錯資訊初始化...</div>
  <div class="gallery" id="gallery"></div>

  <script>
    console.log("=== album.html 開始執行 ===");

    const OWNER = "jan21952";
    const REPO = "Linklink";
    const BASE_PATH = "static/images";

    async function loadAlbum() {
      const debug = document.getElementById('debug');
      const title = document.getElementById('title');
      const gallery = document.getElementById('gallery');

      const params = new URLSearchParams(location.search);
      const dir = params.get('dir');

      debug.innerHTML = `📁 相簿名稱: ${dir || '未取得'}\n`;

      if (!dir) {
        title.textContent = "錯誤：未指定相簿";
        debug.innerHTML += "❌ 未取得 dir 參數";
        return;
      }

      try {
        debug.innerHTML += `🔗 API 網址: 

https://api.github.com/repos/${OWNER}/${REPO}/contents/

${BASE_PATH}/${dir}\n`;
        
        const res = await fetch

(`https://api.github.com/repos/${OWNER}/${REPO}/contents/

${BASE_PATH}/${dir}`);
        
        debug.innerHTML += `📡 API 狀態碼: ${res.status} 

${res.statusText}\n`;

        if (!res.ok) {
          throw new Error(`HTTP 錯誤 ${res.status}`);
        }

        const files = await res.json();
        debug.innerHTML += `✅ 成功取得 ${files.length} 個項

目\n`;

        const images = files.filter(f => 
          f.type === "file" && /\.(jpg|jpeg|png|gif|

webp)$/i.test(f.name)
        );

        debug.innerHTML += `🖼️ 過濾後找到 ${images.length} 

張圖片\n`;

        if (images.length === 0) {
          throw new Error("此資料夾內沒有圖片");
        }

        gallery.innerHTML = "";
        title.textContent = `${dir} (${images.length} 張)`;

        images.forEach(file => {
          const url = `https://raw.githubusercontent.com/

${OWNER}/${REPO}/main/${BASE_PATH}/${dir}/${file.name}`;
          const img = document.createElement('img');
          img.src = url;
          img.alt = file.name;
          img.loading = "lazy";
          img.onclick = () => window.open(url, '_blank');
          gallery.appendChild(img);
        });

        debug.innerHTML += `🎉 縮圖載入完成！點擊可在新分頁看

大圖`;

      } catch (err) {
        debug.innerHTML += `\n❌ 發生錯誤：${err.message}\n`;
        console.error(err);
        title.textContent = dir || "載入失敗";
      }
    }

    // 確保頁面載入後執行
    window.addEventListener('load', () => {
      console.log("頁面 load 事件觸發");
      loadAlbum();
    });
  </script>
</body>
</html>
