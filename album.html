<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 

initial-scale=1.0">
  <title>相簿26 - 114Y</title>
  <link 

href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4

/css/lightbox.min.css" rel="stylesheet">
  <style>
    body { 
      font-family: "Microsoft JhengHei", sans-serif; 
      margin: 20px; background: #f4f6f9; 
    }
    h1 { text-align: center; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 

1fr));
      gap: 15px;
      max-width: 1200px;
      margin: 30px auto;
    }
    .gallery a img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .gallery a:hover img { transform: scale(1.05); }
  </style>
</head>
<body>
  <h1>114Y 相簿</h1>
  <p style="text-align:center;"><a href="index_al.html">← 返

回相簿列表</a></p>

  <div id="debug" style="background:#fff; padding:15px; 

border:3px solid #27ae60; border-radius:10px; margin:20px 

auto; max-width:800px;">
    載入中...
  </div>

  <div class="gallery" id="gallery"></div>

  <script 

src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/

js/lightbox.min.js"></script>

  <script>
    document.getElementById('debug').innerHTML = "✅ 

JavaScript 執行成功！<br>";

    // 直接硬碼幾張圖片（先測試燈箱是否正常）
    const gallery = document.getElementById('gallery');
    const images = [
      "1140629.jpg",
      // 請把你 114Y 資料夾裡面的檔名加在下面
    ];

    images.forEach(filename => {
      const url = 

`https://raw.githubusercontent.com/jan21952/Linklink/main/sta

tic/images/114Y/${filename}`;
      const a = document.createElement('a');
      a.href = url;
      a.setAttribute('data-lightbox', 'album');
      a.innerHTML = `<img src="${url}" loading="lazy">`;
      gallery.appendChild(a);
    });

    document.getElementById('debug').innerHTML += "✅ 已顯示

測試縮圖<br>點擊圖片測試燈箱";

    // Lightbox 設定
    lightbox.option({
      wrapAround: true,
      showImageNumberLabel: true,
      albumLabel: "第 %1 張 / 共 %2 張"
    });
  </script>
</body>
</html>
