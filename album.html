<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相簿13</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; margin: 20px; background: #f4f6f9; line-height: 1.6; }
    .header { text-align: center; margin-bottom: 20px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: zoom-in;
    }
    .debug { 
      background: #fff; padding: 15px; border: 2px solid #ddd; 
      border-radius: 8px; margin: 15px 0; font-size: 14px; 
    }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">載入中...</h1>
    <div class="back"><a href="index_al.html">← 返回相簿列表</a></div>
  </div>

  <div id="debug" class="debug">除錯資訊初始化...</div>
  <div class="gallery" id="gallery"></div>

  <script>
    const OWNER = "jan21952";
    const REPO = "Linklink";
    const BASE_PATH = "static/images";

    async function loadAlbum() {
      const debug = document.getElementById('debug');
      const title = document.getElementById('title');
      const gallery = document.getElementById('gallery');

      const params = new URLSearchParams(location.search);
      const dir = params.get('dir');

      debug.innerHTML = `📁 相簿名稱: ${dir || '未指定'}`;

      if (!dir) {
        title.textContent = "錯誤：未指定相簿";
        return;
      }

      try {
        debug.innerHTML += `<br>🔍 正在向 GitHub 請求資料...`;
        
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${BASE_PATH}/${dir}`);
        
        debug.innerHTML += `<br>📡 API 回應狀態: ${res.status}`;
        
        if (!res.ok) throw new Error(`HTTP 錯誤 ${res.status}`);

        let files = await res.json();
        debug.innerHTML += `<br>✅ 取得 ${files.length} 個檔案`;

        // 過濾圖片
        files = files.filter(f => f.type === "file" && /\.(jpg|jpeg|png|gif|webp)$/i.test(f.name));
        debug.innerHTML += `<br>🖼️ 找到 ${files.length} 張有效圖片`;

        if (files.length === 0) {
          throw new Error("沒有找到圖片檔案");
        }

        gallery.innerHTML = "";
        title.textContent = `${dir} (${files.length} 張)`;

        files.forEach(file => {
          const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${BASE_PATH}/${dir}/${file.name}`;
          
          const img = document.createElement('img');
          img.src = url;
          img.alt = file.name;
          img.loading = "lazy";
          
          // 簡單點擊放大（直接在新分頁開啟大圖）
          img.onclick = () => window.open(url, '_blank');
          
          gallery.appendChild(img);
        });

        debug.innerHTML += `<br>🎉 縮圖載入完成！<br>（點擊圖片可在新分頁放大查看）`;

      } catch (err) {
        debug.innerHTML += `<br><span class="error">❌ 錯誤：${err.message}</span>`;
        title.textContent = dir;
        console.error(err);
      }
    }

    window.addEventListener('load', loadAlbum);
  </script>
</body>
</html>
