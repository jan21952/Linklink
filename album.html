<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 

initial-scale=1.0">
  <title>相簿21</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; 

margin: 20px; background: #f4f6f9; }
    .debug { background: #fff; padding: 15px; border: 3px 

solid #333; border-radius: 10px; margin: 20px 0; font-size: 

15px; }
    .gallery { display: grid; grid-template-columns: repeat

(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 20px; 

}
    img { width: 100%; height: 180px; object-fit: cover; 

border-radius: 8px; }
  </style>
</head>
<body>
  <h1 id="title">載入中...</h1>
  <a href="index_al.html">← 返回相簿列表</a>

  <div id="debug" class="debug">除錯資訊初始化...</div>
  <div class="gallery" id="gallery"></div>

  <script>
    // 立即執行，不等 load 事件
    console.log("=== V21 立即執行 ===");
    
    const debug = document.getElementById('debug');
    debug.innerHTML += "\n✅ JavaScript 開始執行";

    const OWNER = "jan21952";
    const REPO = "Linklink";
    const BASE_PATH = "static/images";

    const params = new URLSearchParams(location.search);
    const dir = params.get('dir');

    debug.innerHTML += `\n📁 相簿: ${dir || '未取得'}`;

    if (!dir) {
      document.getElementById('title').textContent = "錯誤：

未指定相簿";
      debug.innerHTML += "\n❌ 沒有 dir 參數";
    } else {
      debug.innerHTML += "\n🔍 開始呼叫 GitHub API...";

      fetch(`https://api.github.com/repos/${OWNER}/

${REPO}/contents/${BASE_PATH}/${dir}`)
        .then(res => {
          debug.innerHTML += `\n📡 API 狀態: ${res.status}`;
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(files => {
          debug.innerHTML += `\n✅ 取得 ${files.length} 個項

目`;

          const images = files.filter(f => f.type === "file" 

&& /\.(jpg|jpeg|png|gif|webp)$/i.test(f.name));
          debug.innerHTML += `\n🖼️ 找到 ${images.length} 張

圖片`;

          const gallery = document.getElementById('gallery');
          gallery.innerHTML = "";

          images.forEach(file => {
            const url = `https://raw.githubusercontent.com/

${OWNER}/${REPO}/main/${BASE_PATH}/${dir}/${file.name}`;
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('data-lightbox', 'album');
            a.innerHTML = `<img src="${url}" 

loading="lazy">`;
            gallery.appendChild(a);
          });

          document.getElementById('title').textContent = `

${dir} (${images.length} 張)`;
          debug.innerHTML += "\n🎉 縮圖載入完成！";
        })
        .catch(err => {
          debug.innerHTML += `\n❌ 錯誤: ${err.message}`;
          console.error(err);
        });
    }
  </script>

  <script 

src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/

js/lightbox.min.js"></script>
</body>
</html>
