<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 

initial-scale=1.0">
  <title>相簿20</title>
  <style>
    body { 
      font-family: "Microsoft JhengHei", sans-serif; 
      margin: 20px; background: #f4f6f9; line-height: 1.6; 
    }
    .header { text-align: center; margin-bottom: 20px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 

1fr));
      gap: 12px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .debug { 
      background: #fff; padding: 15px; border: 2px solid 

#333; 
      border-radius: 8px; margin: 20px 0; font-size: 14px; 
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">載入中...</h1>
    <div class="back"><a href="index_al.html">← 返回相簿列表

</a></div>
  </div>

  <div id="debug" class="debug">除錯資訊初始化...</div>
  <div class="gallery" id="gallery"></div>

  <script>
    const OWNER = "jan21952";
    const REPO = "Linklink";
    const BASE_PATH = "static/images";

    async function loadAlbum() {
      const debug = document.getElementById('debug');
      const title = document.getElementById('title');
      const gallery = document.getElementById('gallery');

      const params = new URLSearchParams(location.search);
      const dir = params.get('dir');

      debug.innerHTML = `📁 相簿: ${dir}`;

      if (!dir) {
        title.textContent = "錯誤：未指定相簿";
        return;
      }

      try {
        debug.innerHTML += `<br>🔍 正在呼叫 GitHub API...`;
        
        const res = await fetch

(`https://api.github.com/repos/${OWNER}/${REPO}/contents/

${BASE_PATH}/${dir}`);
        debug.innerHTML += `<br>📡 API 狀態: ${res.status}`;

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        let files = await res.json();
        debug.innerHTML += `<br>✅ 取得 ${files.length} 個檔

案`;

        files = files.filter(f => f.type === "file" && /\.

(jpg|jpeg|png|gif|webp)$/i.test(f.name));

        debug.innerHTML += `<br>🖼️ 找到 ${files.length} 張

圖片`;

        gallery.innerHTML = "";

        files.forEach(file => {
          const url = `https://raw.githubusercontent.com/

${OWNER}/${REPO}/main/${BASE_PATH}/${dir}/${file.name}`;
          
          const a = document.createElement('a');
          a.href = url;
          a.setAttribute('data-lightbox', 'album');
          a.setAttribute('data-title', file.name);
          a.innerHTML = `<img src="${url}" alt="${file.name}" 

loading="lazy">`;
          gallery.appendChild(a);
        });

        title.textContent = `${dir} (${files.length} 張)`;
        debug.innerHTML += `<br>🎉 縮圖載入完成`;

        // Lightbox 設定
        setTimeout(() => {
          lightbox.option({
            wrapAround: true,
            showImageNumberLabel: true,
            albumLabel: "第 %1 張 / 共 %2 張"
          });
          debug.innerHTML += `<br>✅ Lightbox 已初始化`;
        }, 500);

      } catch (err) {
        debug.innerHTML += `<br><strong style="color:red;">❌ 

錯誤：${err.message}</strong>`;
        console.error(err);
      }
    }

    window.addEventListener('load', loadAlbum);
  </script>

  <!-- Lightbox -->
  <script 

src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/

js/lightbox.min.js"></script>
</body>
</html>
