<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 

initial-scale=1.0">
  <title>相簿24</title>
  <link 

href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4

/css/lightbox.min.css" rel="stylesheet">
  <style>
    body { 
      font-family: "Microsoft JhengHei", sans-serif; 
      margin: 20px; background: #f4f6f9; 
    }
    .header { text-align: center; margin-bottom: 20px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 

1fr));
      gap: 12px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .gallery a img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.3s;
    }
    .gallery a:hover img { transform: scale(1.05); }
    .debug { 
      background: #fff; padding: 15px; border: 3px solid 

#27ae60; 
      border-radius: 10px; margin: 20px 0; font-size: 15px; 
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">載入中...</h1>
    <a href="index_al.html">← 返回相簿列表</a>
  </div>

  <div id="debug" class="debug">除錯資訊初始化...</div>
  <div class="gallery" id="gallery"></div>

  <script 

src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/

js/lightbox.min.js"></script>

  <script>
    document.getElementById('debug').innerHTML += "<br>✅ 

JavaScript 已執行";

    const OWNER = "jan21952";
    const REPO = "Linklink";
    const BASE_PATH = "static/images";

    const params = new URLSearchParams(location.search);
    const dir = params.get('dir');

    document.getElementById('debug').innerHTML += `<br>📁 相

簿: ${dir}`;

    if (!dir) {
      document.getElementById('title').textContent = "錯誤：

未指定相簿";
    } else {
      fetch(`https://api.github.com/repos/${OWNER}/

${REPO}/contents/${BASE_PATH}/${dir}`)
        .then(res => {
          document.getElementById('debug').innerHTML += 

`<br>📡 API 狀態: ${res.status}`;
          if (!res.ok) throw new Error("API 錯誤");
          return res.json();
        })
        .then(files => {
          const images = files.filter(f => f.type === "file" 

&& /\.(jpg|jpeg|png|gif|webp)$/i.test(f.name));
          
          document.getElementById('debug').innerHTML += 

`<br>🖼️ 找到 ${images.length} 張圖片`;
          document.getElementById('title').textContent = `

${dir} (${images.length} 張)`;

          const gallery = document.getElementById('gallery');
          gallery.innerHTML = "";

          images.forEach(file => {
            const url = `https://raw.githubusercontent.com/

${OWNER}/${REPO}/main/${BASE_PATH}/${dir}/${file.name}`;
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('data-lightbox', 'album');
            a.setAttribute('data-title', file.name);
            a.innerHTML = `<img src="${url}" 

loading="lazy">`;
            gallery.appendChild(a);
          });

          document.getElementById('debug').innerHTML += 

"<br>🎉 縮圖載入完成！點擊可燈箱放大";
        })
        .catch(err => {
          document.getElementById('debug').innerHTML += 

`<br>❌ 錯誤: ${err.message}`;
        });
    }
  </script>
</body>
</html>
