<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 

initial-scale=1.0">
  <title>相簿25 - 114Y</title>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; 

margin: 20px; background: #f4f6f9; }
    .gallery { display: grid; grid-template-columns: repeat

(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; 

}
    .gallery a img { width: 100%; height: 180px; object-fit: 

cover; border-radius: 8px; box-shadow: 0 4px 10px rgba

(0,0,0,0.1); }
    .gallery a:hover img { transform: scale(1.05); }
  </style>
</head>
<body>
  <h1 id="title">114Y 相簿</h1>
  <a href="index_al.html">← 返回相簿列表</a>

  <div id="debug" style="background:#fff; padding:15px; 

border:3px solid #27ae60; border-radius:10px; margin:20px 

0;">
    載入中...
  </div>

  <div class="gallery" id="gallery"></div>

  <script>
    document.getElementById('debug').innerHTML = "✅ 

JavaScript 成功執行！<br>";

    const dir = "114Y";   // 直接寫死測試用

    document.getElementById('debug').innerHTML += "📁 正在顯

示 " + dir + " 的照片<br>";

    // 直接硬寫幾張圖片測試
    const gallery = document.getElementById('gallery');
    const testImages = ["1140629.jpg", "其他檔名.jpg"]; // 你

可以改成實際檔名

    // 自動抓取
    fetch

('https://api.github.com/repos/jan21952/Linklink/contents/sta

tic/images/114Y')
      .then(r => r.json())
      .then(files => {
        const images = files.filter(f => f.name.match(/\.

(jpg|jpeg|png)$/i));
        document.getElementById('debug').innerHTML += `找到 

${images.length} 張圖片<br>`;

        images.forEach(file => {
          const url = 

`https://raw.githubusercontent.com/jan21952/Linklink/main/sta

tic/images/114Y/${file.name}`;
          const a = document.createElement('a');
          a.href = url;
          a.setAttribute('data-lightbox', 'album');
          a.innerHTML = `<img src="${url}" loading="lazy">`;
          gallery.appendChild(a);
        });

        document.getElementById('debug').innerHTML += "✅ 縮

圖載入完成！";
      })
      .catch(err => {
        document.getElementById('debug').innerHTML += "❌ 錯

誤: " + err.message;
      });
  </script>

  <script 

src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/

js/lightbox.min.js"></script>
</body>
</html>
