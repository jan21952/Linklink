<div class="gallery" id="gallery"></div>

<script>
  const OWNER = "jan21952";
  const REPO = "Linklink";
  const BASE_PATH = "static/images";
  const DIR = "114Y";

  const files = ["1140629.jpg", "1140630.jpg", "1140631.jpg"]; // 手動列出檔案

  const gallery = document.getElementById('gallery');
  files.forEach((name, index) => {
    const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${BASE_PATH}/${DIR}/${name}`;
    const img = document.createElement('img');
    img.src = url;
    img.alt = name;
    img.loading = "lazy";
    img.addEventListener('click', () => showImage(index));
    gallery.appendChild(img);
  });

  let currentIndex = 0;
  function showImage(index) {
    currentIndex = index;
    const viewer = document.getElementById('viewer');
    viewer.src = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${BASE_PATH}/${DIR}/${files[index]}`;
    document.getElementById('viewerBox').style.display = "block";
    updateButtons();
  }

  function updateButtons() {
    document.getElementById('prevBtn').disabled = (currentIndex === 0);
    document.getElementById('nextBtn').disabled = (currentIndex === files.length - 1);
  }
</script>
